name: PiePHP Strict CI

on: [push, pull_request]

jobs:
  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout of the code
      uses: actions/checkout@v5
      with:
        clean: true

  structure:
      name: File Structure Verification
      runs-on: ubuntu-latest
      steps:
      - name: Code checkout
        uses: actions/checkout@v5
        with:
          clean: true
      - name: Missing files check
      # Array of all required files for the PiePHP project
        run: |
          REQUIRED_FILES=(
            ".gitignore"
            ".htaccess"
            "config.json"
            "index.php"
            "README.md"
            "robots.txt"
            "Core/autoload.php"
            "Core/Controller.php"
            "Core/Core.php"
            "Core/Database.php"
            "Core/Entity.php"
            "Core/ORM.php"
            "Core/Request.php"
            "Core/Router.php"
            "Core/TemplateEngine.php"
            "src/routes.php"
            "src/Controller/AppController.php"
            "src/Controller/UserController.php"
            "src/Model/UserModel.php"
            "src/View/index.php"
            "src/View/App/index.php"
            "src/View/Error/404.php"
            "src/View/Flash/default.php"
            "src/View/Flash/error.php"
            "src/View/Flash/success.php"
            "src/View/User/index.php"
            "src/View/User/login.php"
            "src/View/User/register.php"
            "src/View/User/show.php"
          )
          
          echo "::group::Files verification"
          for file in "${REQUIRED_FILES[@]}"; do
            test -f "$file" || { echo "::error::Missing required file: $file"; exit 1; }
          done
          echo "::endgroup::"
          
          echo "Structure: Directory structure perfectly respected." >> $GITHUB_STEP_SUMMARY

  linting:
    name: PHP Linting
    runs-on: ubuntu-latest
    container:
      image: php:latest
    steps:
    - name: Checkout of the code
      uses: actions/checkout@v5
      with:
        # clean sert à supprimer les fichiers non suivis et les répertoires avant de commencer le job
        clean: true
    - name: Linting
      run: |
        echo "::group::Details of the Linting process"
        for file in $(find . -type f -name "*.php" -not -path "./vendor/*"); do
          php -l "$file" || exit 1
        done
        echo "::endgroup::"
        echo "Linting : End with no errors." >> $GITHUB_STEP_SUMMARY

  psr12:
    name: PSR-12 Validation
    runs-on: ubuntu-latest
    container:
      image: php:latest
    steps:
    - name: Checkout of the code
      uses: actions/checkout@v5
      with:
        clean: true
    - name: PSR-12 Validation
    # Code sniffer c'est un outil qui permet de vérifier que le code PHP respecte les standards de codage PSR-12. Il est utilisé pour maintenir la qualité et la lisibilité du code.
      run: |
        curl -sSL https://squizlabs.github.io/PHP_CodeSniffer/phpcs.phar -o phpcs.phar
        chmod +x phpcs.phar
        php phpcs.phar --standard=PSR12 --colors --ignore=src/View/,webroot/ Core/ src/ index.php
        echo "PSR-12 standard respected." >> $GITHUB_STEP_SUMMARY