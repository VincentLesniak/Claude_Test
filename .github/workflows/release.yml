# -----------------------------------------------------------------------------
# Release
# -----------------------------------------------------------------------------
# Se déclenche quand on pousse un tag de version, avec ou sans "v" devant :
#     git tag -a 0.1.0 -m "Version 0.1.0" && git push origin 0.1.0
#     git tag -a v0.1.0 -m "Version 0.1.0" && git push origin v0.1.0
# Créer une release depuis l'interface GitHub (Releases > Draft a new
# release) crée aussi le tag et déclenche donc ce workflow.
#
# On peut aussi le lancer à la main (onglet Actions > Release > Run
# workflow) pour un tag qui existe déjà, par exemple pour compléter une
# release créée avant ce workflow.
#
# Le workflow vérifie que le tag correspond au fichier VERSION, relance les
# tests, puis crée la "Release" GitHub, ou complète celle qui existe déjà,
# avec le texte du CHANGELOG correspondant.
# -----------------------------------------------------------------------------
name: Release

on:
  push:
    tags:
      # Syntaxe "glob" de GitHub : [0-9]* = un chiffre suivi de n'importe quoi.
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existant à publier (ex. 0.1.0)'
        required: true

# Créer ou modifier une release demande le droit d'écrire dans le dépôt.
permissions:
  contents: write

jobs:
  release:
    name: Publication de la release
    runs-on: ubuntu-latest
    env:
      # Lancement manuel : le tag vient du formulaire. Sinon, GITHUB_REF_NAME
      # contient le nom du tag poussé.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Récupération du code du tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Le tag correspond-il au fichier VERSION ?
        # ${TAG#v} retire un éventuel "v" au début : "v0.1.0" -> "0.1.0".
        run: |
          tag="${TAG#v}"
          file="$(cat VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::Le tag $TAG ne correspond pas au fichier VERSION ($file)."
            exit 1
          fi

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Tests
        run: php tests/run.php

      - name: Extraction des notes de version depuis le CHANGELOG
        # awk lit le CHANGELOG ligne par ligne : il commence à afficher après
        # le titre "## [X.Y.Z]" et s'arrête au titre de section suivant.
        run: |
          version="$(cat VERSION)"
          awk -v v="## [$version]" '
            index($0, v) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Création ou mise à jour de la release GitHub
        # Si la release existe déjà (créée depuis l'interface), on remplace
        # seulement ses notes ; sinon on la crée.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "PiePHP $TAG" --notes-file release-notes.md
          fi
